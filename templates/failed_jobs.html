{% extends "base.html" %}

{% block title %}Jobs échoués - OCR AI{% endblock %}

{% block content %}
<div class="container" style="max-width: 1400px; margin: 0 auto; padding: 2rem;">
    <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.5rem;">
            <i data-lucide="wrench" class="icon"></i> Gestion des jobs échoués
        </h1>
        <p style="color: #888; font-size: 0.95rem;">
            Diagnostic et relance des extractions en échec
        </p>
    </div>

    <div id="success-message" class="flash success" style="display: none;">
        <i data-lucide="check-circle" class="icon"></i> Job relancé avec succès !
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <h2 style="font-size: 1.5rem; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 0.5rem; margin: 0;">
                <span><i data-lucide="x-circle" class="icon"></i></span> Jobs en échec <span id="failed-count" style="color: #888; font-weight: 400; font-size: 1rem;"></span>
            </h2>
            <button class="btn btn-secondary" onclick="refreshFailedJobs()"><i data-lucide="refresh-cw" class="icon"></i> Rafraîchir</button>
        </div>
        <div id="failed-jobs-container">
            <p style="color: #666;">Chargement...</p>
        </div>
    </div>
</div>

<style>
    .failed-job-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-left: 4px solid var(--error);
        border-radius: 0.75rem;
        padding: 1.25rem 1.5rem;
        margin-bottom: 1rem;
        transition: all 0.25s ease;
    }

    .failed-job-card:hover {
        border-color: var(--error);
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.1);
    }

    .error-box {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 0.5rem;
        padding: 0.85rem 1rem;
        font-size: 0.85rem;
        color: #f87171;
        margin-top: 0.85rem;
    }

    .btn-retry {
        background: var(--warning);
        color: #1a1200;
        flex-shrink: 0;
    }

    .btn-retry:hover:not(:disabled) {
        background: #fbbf24;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
    }

    .btn-retry:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }
</style>

<script>
function refreshFailedJobs() {
    fetch('/api/jobs?status=failed')
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                renderFailedJobs(data.jobs);
            } else {
                showLoadError();
            }
        })
        .catch(err => {
            console.error('Erreur chargement jobs:', err);
            showLoadError();
        });
}

function showLoadError() {
    document.getElementById('failed-jobs-container').innerHTML = `
        <div style="text-align: center; padding: 3rem; color: #666;">
            <div style="font-size: 3rem; margin-bottom: 1rem;"><i data-lucide="alert-triangle" class="icon"></i></div>
            <p>Impossible de charger les jobs. Réessaie dans quelques secondes.</p>
        </div>
    `;
    lucide.createIcons();
}

function renderFailedJobs(jobs) {
    document.getElementById('failed-count').textContent = jobs.length > 0 ? `(${jobs.length})` : '';
    const container = document.getElementById('failed-jobs-container');

    if (jobs.length === 0) {
        container.innerHTML = `
            <div style="text-align: center; padding: 3rem; color: #666;">
                <div style="font-size: 3rem; margin-bottom: 1rem;"><i data-lucide="check-circle" class="icon"></i></div>
                <p style="color: var(--success); font-weight: 600; font-size: 1.1rem;">Aucun job en échec</p>
                <p style="margin-top: 0.25rem;">Tous les traitements sont OK</p>
            </div>
        `;
        lucide.createIcons();
        return;
    }

    container.innerHTML = jobs.map(createFailedJobCard).join('');
    lucide.createIcons();
}

function createFailedJobCard(job) {
    const createdDate = new Date(job.created_at * 1000).toLocaleString('fr-FR');

    return `
        <div class="failed-job-card" id="failed-job-${job.id}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap;">
                <div style="min-width: 0;">
                    <div style="color: var(--text-primary); font-weight: 600; margin-bottom: 0.3rem; word-break: break-word;">${escapeHtml(job.filename)}</div>
                    <div style="color: #888; font-size: 0.8rem;">
                        ID ${job.id.substring(0, 8)}... · Créé le ${createdDate}${job.client_id ? ' · Client ' + escapeHtml(job.client_id) : ''}
                    </div>
                </div>
                <button class="btn btn-retry" onclick="retryJob('${job.id}')"><i data-lucide="refresh-cw" class="icon"></i> Relancer</button>
            </div>

            <div class="error-box">
                <strong>Erreur :</strong> ${escapeHtml(job.error_message || 'Erreur inconnue')}
            </div>
        </div>
    `;
}

function retryJob(jobId) {
    if (!confirm('Voulez-vous vraiment relancer ce job ?')) {
        return;
    }

    const card = document.getElementById(`failed-job-${jobId}`);
    const retryBtn = card.querySelector('.btn-retry');
    retryBtn.disabled = true;
    retryBtn.innerHTML = '<i data-lucide="loader-2" class="icon" style="animation: rotation 1s linear infinite;"></i> Relance...';
    lucide.createIcons();

    fetch(`/api/retry/${jobId}`, { method: 'POST' })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                const successMsg = document.getElementById('success-message');
                successMsg.style.display = 'flex';

                card.style.transition = 'opacity 0.4s ease';
                card.style.opacity = '0';
                setTimeout(() => {
                    card.remove();
                    refreshFailedJobs();
                }, 400);

                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 3000);
            } else {
                alert('Erreur lors de la relance : ' + data.error);
                retryBtn.disabled = false;
                retryBtn.innerHTML = '<i data-lucide="refresh-cw" class="icon"></i> Relancer'; lucide.createIcons();
            }
        })
        .catch(err => {
            console.error('Erreur retry:', err);
            alert('Erreur lors de la relance');
            retryBtn.disabled = false;
            retryBtn.innerHTML = '<i data-lucide="refresh-cw" class="icon"></i> Relancer'; lucide.createIcons();
        });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
}

refreshFailedJobs();
setInterval(refreshFailedJobs, 30000);
</script>
{% endblock %}
